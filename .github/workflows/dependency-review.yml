name: Dependency review
on: pull_request
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Required only so a failing review can explain itself on the pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The action errors out entirely when the dependency graph is off, which would put a
      # permanent red X on every pull request for a repository setting rather than for anything
      # in the diff. Probe first and warn instead, so a real finding stays distinguishable from
      # a check that could not run.
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/dependency-graph/sbom" --silent 2>/dev/null; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Dependency review skipped::Enable the dependency graph under Settings > Security & analysis to run this check."
          fi
      - if: steps.probe.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Original code is Apache-2.0; flag a dependency whose terms conflict with that.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0
